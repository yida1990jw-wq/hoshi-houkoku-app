<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表示をリセット</title>
    <style>
      body { font: 17px/1.6 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 320px; color: #111; background: #fff; }
      h1 { font-size: 19px; margin: 0 0 8px; }
      p { font-size: 15px; }
      button { width: 100%; padding: 16px; font-size: 18px; font-weight: 700; border: none; border-radius: 8px; background: #4a1fa8; color: #fff; margin-top: 12px; }
      a.btn { display: block; text-align: center; padding: 16px; font-size: 18px; font-weight: 700; border-radius: 8px; background: #0a7a28; color: #fff; text-decoration: none; margin-top: 12px; }
      #log { font-size: 14px; white-space: pre-wrap; background: #f2f2f2; border-radius: 8px; padding: 12px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h1>表示をリセット</h1>
    <p>
      端末に古い表示データが残っていると、更新しても以前の見た目のままになります。
      このボタンで、このサイトの保存データだけを消します。
    </p>
    <p>他のサイトのログイン状態などには影響しません。</p>

    <button id="go" type="button">古いデータを消す</button>
    <div id="log">まだ実行していません</div>
    <a class="btn" id="open" href="./#/submit" style="display: none">報告フォームを開く</a>

    <script>
      document.getElementById('go').addEventListener('click', async function () {
        var log = document.getElementById('log')
        var lines = []
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations()
            lines.push('常駐機能: ' + regs.length + '件')
            for (var i = 0; i < regs.length; i++) await regs[i].unregister()
            lines.push('→ 解除しました')
          } else {
            lines.push('常駐機能: 対応なし')
          }
          if (window.caches) {
            var names = await caches.keys()
            lines.push('保存データ: ' + (names.length ? names.join(', ') : 'なし'))
            for (var j = 0; j < names.length; j++) await caches.delete(names[j])
            lines.push('→ 消しました')
          }
          lines.push('')
          lines.push('完了しました。下のボタンから開き直してください。')
          document.getElementById('open').style.display = 'block'
        } catch (e) {
          lines.push('エラー: ' + (e && e.message ? e.message : e))
        }
        log.textContent = lines.join('\n')
      })
    </script>
  </body>
</html>
