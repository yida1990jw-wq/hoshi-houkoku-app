<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表示の診断</title>
    <style>
      /* 拡大されても内容が右に見切れないよう、幅を狭く保ち左に寄せる */
      body {
        font: 17px/1.5 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        background: #fff;
        color: #111;
        max-width: 320px;
      }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { margin: 6px 0; font-size: 15px; }
      .step { font-weight: 700; margin-top: 14px; }
      input.t { width: 100%; box-sizing: border-box; padding: 12px; margin-top: 4px; }
      #big { font-size: 17px; }
      #small { font-size: 14px; }
      #copy {
        width: 100%;
        margin-top: 14px;
        padding: 16px;
        font-size: 18px;
        font-weight: 700;
        border: none;
        border-radius: 8px;
        background: #4a1fa8;
        color: #fff;
      }
      #log {
        width: 100%;
        box-sizing: border-box;
        height: 150px;
        margin-top: 10px;
        font-size: 13px;
        font-family: ui-monospace, monospace;
      }
      .done { color: #0a7a28; font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>表示の診断</h1>

    <p class="step">① 下の欄をタップ</p>
    <input class="t" id="big" placeholder="タップ（17px）" />
    <p id="r1">まだです</p>

    <p class="step">② 下の欄をタップ</p>
    <input class="t" id="small" placeholder="タップ（14px）" />
    <p id="r2">まだです</p>

    <p class="step">③ ボタンを押してコピー</p>
    <button id="copy" type="button">結果をコピー</button>
    <p id="copied"></p>

    <p style="font-size: 13px; color: #666">コピーできない場合は、下の枠の文字を選んでコピーしてください。</p>
    <textarea id="log" readonly></textarea>

    <script>
      var vv = window.visualViewport
      var results = {}
      function scale() { return vv ? vv.scale : 1 }

      function render() {
        var lines = []
        lines.push('①17px: ' + (results.big || '未実施'))
        lines.push('②14px: ' + (results.small || '未実施'))
        lines.push('現在の倍率: ' + scale().toFixed(2))
        lines.push('innerWidth: ' + window.innerWidth)
        lines.push('visualWidth: ' + (vv ? Math.round(vv.width) : '-'))
        lines.push('①の文字サイズ: ' + getComputedStyle(document.getElementById('big')).fontSize)
        lines.push('②の文字サイズ: ' + getComputedStyle(document.getElementById('small')).fontSize)
        lines.push('画面: ' + screen.width + 'x' + screen.height + ' dpr=' + (window.devicePixelRatio || 1))
        lines.push('はみ出し: ' + (document.documentElement.scrollWidth > window.innerWidth + 1 ? 'あり' : 'なし'))
        lines.push('UA: ' + navigator.userAgent)
        document.getElementById('log').value = lines.join('\n')
      }

      function watch(id, key, labelEl) {
        var el = document.getElementById(id)
        el.addEventListener('focus', function () {
          var before = scale()
          setTimeout(function () {
            var after = scale()
            var zoomed = after > before + 0.01
            results[key] = (zoomed ? '拡大された' : '拡大されない') + ' (' + before.toFixed(2) + '→' + after.toFixed(2) + ')'
            var t = document.getElementById(labelEl)
            t.textContent = results[key]
            t.className = zoomed ? '' : 'done'
            render()
          }, 800)
        })
      }
      watch('big', 'big', 'r1')
      watch('small', 'small', 'r2')

      document.getElementById('copy').addEventListener('click', function () {
        render()
        var text = document.getElementById('log').value
        var msg = document.getElementById('copied')
        if (navigator.clipboard) {
          navigator.clipboard.writeText(text).then(
            function () { msg.textContent = 'コピーしました。チャットに貼り付けてください。'; msg.className = 'done' },
            function () { msg.textContent = 'コピーできませんでした。下の枠から手動でコピーしてください。' },
          )
        } else {
          msg.textContent = '下の枠から手動でコピーしてください。'
        }
      })

      if (vv) { vv.addEventListener('resize', render) }
      render()
    </script>
  </body>
</html>
